<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Buddy - Make Informed Decisions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .tagline {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
            font-size: 1.1em;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-section {
            margin-bottom: 25px;
        }

        .result-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .pros-cons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .pros, .cons {
            padding: 15px;
            border-radius: 8px;
        }

        .pros {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }

        .cons {
            background: #ffebee;
            border-left: 4px solid #f44336;
        }

        .pros h3 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .cons h3 {
            color: #c62828;
            margin-bottom: 10px;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        ul li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
        }

        .pros li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4caf50;
            font-weight: bold;
        }

        .cons li:before {
            content: "✗";
            position: absolute;
            left: 0;
            color: #f44336;
            font-weight: bold;
        }

        .info-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #ff9800;
        }

        .info-box strong {
            color: #e65100;
        }

        .next-steps {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2196f3;
        }

        .next-steps ol {
            padding-left: 20px;
            list-style: decimal;
        }

        .next-steps li {
            padding: 5px 0;
            padding-left: 0;
        }

        .next-steps li:before {
            content: none;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .pros-cons-container {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤔 Decision Buddy</h1>
            <p class="tagline">Your personal assistant for making informed decisions</p>
        </header>

        <div class="card">
            <form id="decisionForm">
                <div class="input-group">
                    <label for="context">Tell me about your situation:</label>
                    <textarea 
                        id="context" 
                        name="context" 
                        placeholder="E.g., I'm considering a job offer at a startup vs. staying at my current corporate job..."
                        required
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="decision">What decision are you trying to make?</label>
                    <input 
                        type="text" 
                        id="decision" 
                        name="decision" 
                        placeholder="E.g., Should I accept the startup job offer?"
                        required
                    />
                </div>

                <button type="submit" id="analyzeBtn">Analyze My Decision</button>
            </form>

            <div class="error" id="error"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Analyzing your decision...</p>
            </div>
        </div>

        <div class="card results" id="results">
            <div class="pros-cons-container">
                <div class="pros">
                    <h3>✅ Pros</h3>
                    <ul id="prosList"></ul>
                </div>
                <div class="cons">
                    <h3>❌ Cons</h3>
                    <ul id="consList"></ul>
                </div>
            </div>

            <div class="result-section">
                <h2>💰 Opportunity Cost</h2>
                <div class="info-box">
                    <p id="opportunityCost"></p>
                </div>
            </div>

            <div class="result-section">
                <h2>⏱️ Time Estimate</h2>
                <div class="info-box">
                    <p id="timeEstimate"></p>
                </div>
            </div>

            <div class="result-section">
                <h2>📋 Next Steps</h2>
                <div class="next-steps" id="nextSteps"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('decisionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const context = document.getElementById('context').value.trim();
            const decision = document.getElementById('decision').value.trim();
            
            if (!context || !decision) {
                showError('Please fill in both fields');
                return;
            }

            // Hide error and results, show loading
            hideError();
            hideResults();
            showLoading();
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ context, decision })
                });

                const data = await response.json();

                if (response.ok) {
                    displayResults(data);
                } else {
                    showError(data.error || 'An error occurred');
                }
            } catch (error) {
                showError('Failed to analyze decision. Please try again.');
            } finally {
                hideLoading();
            }
        });

        function displayResults(data) {
            // Populate pros
            const prosList = document.getElementById('prosList');
            prosList.innerHTML = '';
            data.pros.forEach(pro => {
                const li = document.createElement('li');
                li.textContent = pro;
                prosList.appendChild(li);
            });

            // Populate cons
            const consList = document.getElementById('consList');
            consList.innerHTML = '';
            data.cons.forEach(con => {
                const li = document.createElement('li');
                li.textContent = con;
                consList.appendChild(li);
            });

            // Populate opportunity cost
            document.getElementById('opportunityCost').innerHTML = 
                `<strong>What you're giving up:</strong> ${data.opportunity_cost}`;

            // Populate time estimate
            document.getElementById('timeEstimate').innerHTML = 
                `<strong>Estimated timeline:</strong> ${data.time_estimate}`;

            // Populate next steps
            const nextSteps = document.getElementById('nextSteps');
            nextSteps.innerHTML = '<ol></ol>';
            const ol = nextSteps.querySelector('ol');
            data.next_steps.forEach(step => {
                const li = document.createElement('li');
                li.textContent = step;
                ol.appendChild(li);
            });

            // Show results
            showResults();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            document.getElementById('error').classList.remove('show');
        }

        function showResults() {
            document.getElementById('results').classList.add('show');
        }

        function hideResults() {
            document.getElementById('results').classList.remove('show');
        }

        function showLoading() {
            document.getElementById('loading').classList.add('show');
            document.getElementById('analyzeBtn').disabled = true;
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
            document.getElementById('analyzeBtn').disabled = false;
        }
    </script>
</body>
</html>
